[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-library-local"
version = "1.0.0"
description = "A local, searchable, versionable prompt library with safe variable rendering."
requires-python = ">=3.10"
authors = [{name = "Radwan Abdulhadi Ahmed"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
prompt-library = "prompt_library.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
